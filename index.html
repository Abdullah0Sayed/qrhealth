<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- SEO -->
    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="description"
      content="Qr Health is a smart healthcare platform that simplifies healthcare services, patient management, appointments, and QR-powered medical solutions."
    />

    <!-- Open Graph (Default) -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Qr Health"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- Mobile -->
    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      href="/uploads/qrLogo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/uploads/qrLogo.png"
    />

    <title>Qr Health</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
